<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שינוי במדדי מרכז ופיזור</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f4f6f9;--card:#fff;--ink:#1f2933;--muted:#5b6672;--line:#dde3ea;
  --pri:#2f5fb3;--pri2:#e8effa;
  --good:#1e8a55;--goodbg:#e4f5ec;--bad:#c0392b;--badbg:#fdecea;
  --c1:#2f5fb3;--c2:#1f8a78;--c3:#8a4fb3;--c4:#c0602e;
  --nom:#4472C4;--ord:#FFC000;--int:#E0702E;--rat:#7a7a7a;
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Rubik",Arial,sans-serif;overflow-x:clip}
.wrap{max-width:1100px;margin:0 auto;padding:24px max(4vw,12px) 48px}
h1{margin:0 0 4px;font-size:clamp(26px,4vw,36px);line-height:1.15;text-align:center;color:var(--pri)}
.lead{margin:0 0 18px;text-align:center;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px clamp(12px,3vw,26px);box-shadow:0 4px 18px rgba(20,40,60,.05)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.btn{font:inherit;font-weight:500;min-height:44px;padding:10px 20px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn.main{background:var(--pri);border-color:var(--pri);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.msg{font-weight:500}.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}
button{font:inherit;color:inherit}
.btn:focus-visible,.chip:focus-visible,.slot:focus-visible,.tog:focus-visible{outline:3px solid #8ab4f8;outline-offset:2px}
.chip{display:block;background:#fff;border:2px solid #2b3540;border-radius:12px;padding:10px 12px;text-align:center;cursor:pointer;font-weight:500;line-height:1.4}
.chip small{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.chip.sel{border-color:var(--pri);box-shadow:0 0 0 3px rgba(47,95,179,.3)}
.chip.ok{border-color:var(--good);background:var(--goodbg)}
.chip.no{border-color:var(--bad);background:var(--badbg)}
.chip:disabled{cursor:default}
.why{display:block;margin-top:6px;font-size:14px;font-weight:400;color:#7a2a22;text-align:right}
.pool{display:flex;flex-wrap:wrap;gap:10px;padding:12px;border:2px dashed var(--line);border-radius:14px;background:#fafbfc;margin-bottom:18px;min-height:64px}
.pool:empty::after{content:"כל הכרטיסים שובצו.";color:var(--muted);align-self:center}
.hd{color:#fff;font-weight:700;text-align:center;border-radius:12px;padding:10px 6px;font-size:19px}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}
.nom{background:var(--nom)}.ord{background:var(--ord);color:#3b2d00}.int{background:var(--int)}.rat{background:var(--rat)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:Consolas,"Courier New",monospace;font-size:15px}
.sheet-bg{position:fixed;inset:0;background:rgba(15,25,35,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
.sheet h2{margin:0 0 12px;font-size:19px}
.sheet .list{display:flex;flex-direction:column;gap:8px}
.sheet .chip{width:100%}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- page ---- */
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.nav .n{font-weight:500;color:var(--muted)}
.data{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.val{background:#f2f5f8;border-radius:10px;padding:6px 12px;font-weight:500;direction:ltr}
.lbl{font-weight:500;color:var(--muted);font-size:15px}
.change{background:var(--pri2);border-right:5px solid var(--pri);border-radius:10px;padding:12px 14px;font-size:19px;font-weight:500;margin-bottom:16px}
.mrow{display:grid;grid-template-columns:170px repeat(3,minmax(0,1fr));gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.mname{font-weight:500}
.tog{min-height:46px;border-radius:12px;border:2px solid var(--line);background:#fafbfc;cursor:pointer}
.tog:hover{border-color:#b9c4cf}
.tog[aria-pressed=true]{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:700}
.mrow.ok .tog[aria-pressed=true]{border-color:var(--good);background:var(--goodbg);color:var(--good)}
.mrow.no .tog[aria-pressed=true]{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.res{grid-column:2/-1;font-size:15px;color:var(--muted)}
.res b{color:var(--ink)}
@media(max-width:640px){.mrow{grid-template-columns:repeat(3,minmax(0,1fr))}.mname,.res{grid-column:1/-1}}

</style>
</head>
<body>
<div class="wrap">
  <h1>שינוי במדדי מרכז ופיזור</h1>
  <p class="lead">בחרו לכל מדד: עולה, יורד או לא משתנה.</p>

<section class="panel">
  <div class="nav">
    <button class="btn" id="prev">הקודם</button>
    <span class="n" id="num"></span>
    <button class="btn" id="next">הבא</button>
  </div>
  <div class="lbl">סכומי קנייה (בש"ח) בקופה, לפני השינוי:</div>
  <div class="data" id="data"></div>
  <div class="lbl">מה השתנה:</div>
  <div class="change" id="change"></div>
  <div id="rows"></div>
  <div class="bar">
    <button class="btn main" id="check">בדיקה</button>
    <button class="btn" id="clear">ניקוי הבחירות</button>
    <span class="msg" id="msg"></span>
  </div>
</section>

</div>

<script>
{

const $ = id => document.getElementById(id);
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}



const DATA = [55, 65, 70, 70, 80, 85, 100];
// כל תרחיש: טקסט ופונקציה שמחזירה את הנתונים אחרי השינוי. התשובה מחושבת אוטומטית.
const SCEN = [
  {text:'כל לקוח שילם עוד 5 ש"ח דמי משלוח.', f:a => a.map(x => x + 5)},
  {text:'כל המחירים בחנות הוכפלו, וכל לקוח שילם פי 2.', f:a => a.map(x => x * 2)},
  {text:'התגלתה טעות: הקנייה של 100 ש"ח הייתה בעצם 160 ש"ח.', f:a => a.map(x => x === 100 ? 160 : x)},
  {text:'הגיע לקוח נוסף שקנה ב־75 ש"ח (בדיוק הממוצע).', f:a => [...a, 75]},
  {text:'הקנייה של 55 ש"ח בוטלה.', f:a => a.filter(x => x !== 55)}
];
const sorted = a => [...a].sort((x, y) => x - y);
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const median = a => { const s = sorted(a), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
const mode = a => { const m = {}; a.forEach(x => m[x] = (m[x] || 0) + 1); let best = null, cnt = 1; for (const k in m) if (m[k] > cnt) { cnt = m[k]; best = +k; } return best; };
const range = a => Math.max(...a) - Math.min(...a);
// רבעונים כמו QUARTILE.EXC באקסל
const qExc = (s, p) => { const n = s.length, r = p * (n + 1), lo = Math.floor(r), f = r - lo; if (lo < 1) return s[0]; if (lo >= n) return s[n - 1]; return s[lo - 1] + f * (s[lo] - s[lo - 1]); };
const iqr = a => { const s = sorted(a); return qExc(s, 0.75) - qExc(s, 0.25); };
const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
const MEAS = [
  {name:'ממוצע', f:mean}, {name:'חציון', f:median}, {name:'שכיח', f:mode},
  {name:'טווח', f:range}, {name:'טווח בין רבעוני', f:iqr}, {name:'סטיית תקן', f:sd}
];
const CH = [{k:'up', t:'עולה ↑'}, {k:'down', t:'יורד ↓'}, {k:'same', t:'לא משתנה ='}];
const fmt = x => x === null ? 'אין' : String(+x.toFixed(2));
const dir = (b, a) => Math.abs(a - b) < 1e-9 ? 'same' : (a > b ? 'up' : 'down');

let cur = 0, picks = SCEN.map(() => ({})), checked = SCEN.map(() => false);
$('data').innerHTML = DATA.map(x => `<span class="val">${x}</span>`).join('');

function render(){
  const s = SCEN[cur], after = s.f(DATA);
  $('num').textContent = `שינוי ${cur + 1} מתוך ${SCEN.length}`;
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === SCEN.length - 1;
  $('change').textContent = s.text;
  $('rows').innerHTML = MEAS.map((m, i) => {
    const b = m.f(DATA), a = m.f(after), right = dir(b, a), p = picks[cur][i];
    let cls = 'mrow';
    if (checked[cur] && p) cls += p === right ? ' ok' : ' no';
    const res = checked[cur] && p ? `<div class="res">לפני: <b>${fmt(b)}</b> &nbsp; אחרי: <b>${fmt(a)}</b>${p !== right ? ' &nbsp; התשובה: <b>' + CH.find(c => c.k === right).t + '</b>' : ''}</div>` : '';
    return `<div class="${cls}"><div class="mname">${m.name}</div>` +
      CH.map(c => `<button class="tog" data-i="${i}" data-k="${c.k}" aria-pressed="${p === c.k}">${c.t}</button>`).join('') + res + '</div>';
  }).join('');
  $('msg').textContent = '';
}
$('rows').addEventListener('click', e => {
  const b = e.target.closest('.tog');
  if (!b) return;
  picks[cur][b.dataset.i] = b.dataset.k;
  checked[cur] = false;
  render();
});
$('check').onclick = () => {
  checked[cur] = true;
  render();
  const left = MEAS.length - Object.keys(picks[cur]).length;
  if (left) { $('msg').textContent = `נותרו ${left} מדדים בלי בחירה.`; $('msg').className = 'msg bad'; }
};
$('clear').onclick = () => { picks[cur] = {}; checked[cur] = false; render(); };
$('prev').onclick = () => { if (cur > 0) { cur--; render(); } };
$('next').onclick = () => { if (cur < SCEN.length - 1) { cur++; render(); } };
render();

}
</script>
</body>
</html>
